services:
  jev-signal:
    build: .
    container_name: jev-signal
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      MAX_CONCURRENT_ANALYSES: 4
    ports:
      - "127.0.0.1:8792:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
